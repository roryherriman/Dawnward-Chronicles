name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-check
          lua5.1 -v
          luacheck --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hygiene, lint (L0) and tests (L1/L2)
        run: python tools/check.py
