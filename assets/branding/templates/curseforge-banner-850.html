<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<!-- CurseForge description banner, 850 x 213. The same composition as
     curseforge-banner.html (1920 x 480), recomposed for the smaller size:
     the vector lockup takes a larger share of the width and the tagline is
     set larger than a straight scale-down would leave it, so both stay sharp
     and readable. -->
<style>
body { width: 850px; height: 213px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 56px 0 22px; overflow: hidden;
  background: radial-gradient(ellipse 70% 60% at 50% 108%, rgba(224,138,60,.35), rgba(75,59,107,.25) 45%, transparent 70%), var(--night); }
img { width: 500px; display: block; }
p { font-size: 21px; font-style: italic; text-align: right; line-height: 1.35; white-space: nowrap; }
</style></head>
<body>
<img src="../svg/dawnward-lockup-dark-transparent.svg" alt="Dawnward Chronicles">
<p>A living chronicle<br>for your character.<br><span style="color:var(--gold)">Built to complement<br>Total RP 3.</span></p>
</body></html>
